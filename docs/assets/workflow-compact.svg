<svg xmlns="http://www.w3.org/2000/svg" width="416" height="204" viewBox="0 0 416 204" role="img" aria-labelledby="title desc"><title id="title">work-system-feedback workflow</title><desc id="desc">Work branches into fragments for a weekly report and firsthand notes for a sweep, repair, and later check.</desc><g font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="416" height="204" rx="14" fill="#101B2C" stroke="none"/><rect x="13" y="11" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 39)"><path d="M-10 0h6q4 0 6 -6h8 M-4 0q4 0 6 6h8" fill="none" stroke="#FFC58B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="35" font-size="18" fill="#F3F6F8" font-weight="650" >Work performed</text><text x="60" y="55" font-size="14" fill="#CED9E3" font-weight="400" >Choose a record for the intended reader.</text><rect x="13" y="73" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 101)"><path d="M-8 -11h12l5 5v17H-8z M4 -11v6h5 M-4 0h8 M-4 5h6" fill="none" stroke="#FFC58B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="97" font-size="18" fill="#F3F6F8" font-weight="650" >Fragment to weekly report</text><text x="60" y="117" font-size="14" fill="#CED9E3" font-weight="400" >A reader checks and uses the result.</text><rect x="13" y="135" width="390" height="56" rx="9" fill="#1A293C" stroke="#3C4D60"/><g transform="translate(36 163)"><path d="M-8 -7h15 M-8 0h15 M-8 7h10" fill="none" stroke="#FFC58B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="159" font-size="18" fill="#F3F6F8" font-weight="650" >Session notes to sweep and repair</text><text x="60" y="179" font-size="14" fill="#CED9E3" font-weight="400" >Check use and recurrence in the next window.</text></g></svg>
