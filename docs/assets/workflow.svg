<svg xmlns="http://www.w3.org/2000/svg" width="960" height="351" viewBox="0 0 960 351" role="img" aria-labelledby="title desc">
<title id="title">Repair feedback loop</title>
<desc id="desc">A session note leads to a sweep, a decision on repair, and a later sweep that checks use and recurrence. A usable work result can also go into a weekly fragment and report.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" orient="auto" markerWidth="9" markerHeight="10" refX="8" refY="5"><path d="M0 0L8 5L0 10Z" fill="#984312"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 8L8 0M6 10L10 6" fill="none" stroke="#984312" stroke-width="1.2"/></pattern></defs>
<rect x="0.5" y="0.5" width="959" height="350" rx="8" fill="#f6f5f1" stroke="#c5c9c3"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="35" y="48" font-size="31" fill="#172529" font-weight="680" >How a repair earns closure</text>
<path d="M35 67H925" fill="none" stroke="#c6cbc5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text x="39" y="103" font-size="14" fill="#984312" font-weight="700" letter-spacing="1.2">WORK RESULT</text>
<text x="39" y="144" font-size="24" fill="#172529" font-weight="650" >Weekly fragment</text>
<text x="39" y="172" font-size="18" fill="#45565a" font-weight="400" >Evidence a reader</text>
<text x="39" y="195" font-size="18" fill="#45565a" font-weight="400" >can use this week.</text>
<path d="M49 213v44" fill="none" stroke="#984312" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="39" y="293" font-size="21" fill="#172529" font-weight="650" >Weekly report</text>
<path d="M291 88v228" fill="none" stroke="#c6cbc5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<path d="M377 131Q388 99 419 99H677" fill="none" stroke="#984312" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M825 116Q888 137 888 178v48" fill="none" stroke="#984312" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M860 270Q830 304 794 304H556" fill="none" stroke="#984312" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M409 285Q354 265 354 228v-35" fill="none" stroke="#984312" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/>
<circle cx="393" cy="142" r="7" fill="#f6f5f1" stroke="#984312" stroke-width="3"/>
<text x="410" y="148" font-size="21" fill="#172529" font-weight="650" >Session note</text>
<text x="410" y="172" font-size="16" fill="#45565a" font-weight="400" >Firsthand friction</text>
<circle cx="685" cy="99" r="7" fill="#f6f5f1" stroke="#984312" stroke-width="3"/>
<text x="704" y="104" font-size="21" fill="#172529" font-weight="650" >Sweep notes</text>
<text x="704" y="130" font-size="16" fill="#45565a" font-weight="400" >Count direct and</text>
<text x="704" y="150" font-size="16" fill="#45565a" font-weight="400" >relayed accounts.</text>
<circle cx="870" cy="250" r="7" fill="#f6f5f1" stroke="#984312" stroke-width="3"/>
<text x="847" y="254" font-size="21" fill="#172529" font-weight="650" text-anchor="end">Repair</text>
<text x="847" y="278" font-size="16" fill="#45565a" font-weight="400" text-anchor="end">Owner acts on evidence.</text>
<circle cx="547" cy="304" r="7" fill="#f6f5f1" stroke="#984312" stroke-width="3"/>
<text x="365" y="319" font-size="21" fill="#172529" font-weight="650" >Next sweep</text>
<rect x="473" y="193" width="289" height="37" rx="18" fill="#fae5d3" stroke="none"/>
<text x="618" y="218" font-size="18" fill="#984312" font-weight="650" text-anchor="middle">Check use and recurrence</text>
</g></svg>
