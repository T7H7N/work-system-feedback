<svg xmlns="http://www.w3.org/2000/svg" width="396" height="505" viewBox="0 0 396 505" role="img" aria-labelledby="title desc">
<title id="title">Signal ledger: final export item</title>
<desc id="desc">Three records, two direct sessions and one relay. The repair opened January 5 and closed January 12 after the tests and actual use were confirmed.</desc>
<rect x="0.5" y="0.5" width="395" height="504" rx="8" fill="#f6f5f1" stroke="#c5c9c3"/>
<g font-family="Segoe UI, Arial, sans-serif">
<rect x="10" y="11" width="376" height="482" rx="4" fill="#fffefb" stroke="#c6cbc5"/>
<rect x="10" y="11" width="376" height="44" rx="4" fill="#f1e4d7" stroke="none"/>
<g transform="translate(24 21)"><path d="M0 0h12l6 6v18H0z M12 0v6h6 M4 11h9 M4 16h9" fill="none" stroke="#984312" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></g>
<text x="55" y="40" font-size="18" fill="#984312" font-weight="600" font-family="Consolas, monospace">signal-ledger.md</text>
<text x="25" y="90" font-size="23" fill="#172529" font-weight="680" >Final item omitted from export</text>
<text x="25" y="119" font-size="16" fill="#45565a" font-weight="400" >Input ended without a trailing line break.</text>
<rect x="23" y="142" width="350" height="78" rx="4" fill="#fae5d3" stroke="none"/>
<path d="M118 153v55 M258 153v55" fill="none" stroke="#dbba9f" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text x="39" y="177" font-size="26" fill="#984312" font-weight="700" >3</text>
<text x="39" y="202" font-size="15" fill="#172529" font-weight="400" >records</text>
<text x="134" y="177" font-size="26" fill="#984312" font-weight="700" >2</text>
<text x="134" y="202" font-size="15" fill="#172529" font-weight="400" >direct sessions</text>
<text x="275" y="177" font-size="26" fill="#984312" font-weight="700" >1</text>
<text x="275" y="202" font-size="15" fill="#172529" font-weight="400" >relay only</text>
<text x="25" y="256" font-size="16" fill="#984312" font-weight="600" font-family="Consolas, monospace">JAN 05</text>
<text x="118" y="256" font-size="18" fill="#172529" font-weight="690" >Open</text>
<text x="25" y="281" font-size="16" fill="#172529" font-weight="400" >Export maintainer to repair and rerun</text>
<text x="25" y="303" font-size="16" fill="#172529" font-weight="400" >saved inputs.</text>
<path d="M25 321H370" fill="none" stroke="#c6cbc5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text x="25" y="350" font-size="16" fill="#984312" font-weight="600" font-family="Consolas, monospace">JAN 12</text>
<text x="118" y="350" font-size="18" fill="#172529" font-weight="690" >Closed</text>
<text x="25" y="375" font-size="16" fill="#172529" font-weight="400" >Both input conditions passed.</text>
<text x="25" y="397" font-size="16" fill="#172529" font-weight="400" >The reader used the corrected output.</text>
<path d="M25 418H370" fill="none" stroke="#c6cbc5" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" />
<text x="25" y="449" font-size="16" fill="#45565a" font-weight="400" >Reopen on a new direct observation</text>
<text x="25" y="471" font-size="16" fill="#45565a" font-weight="400" >of the missing item.</text>
